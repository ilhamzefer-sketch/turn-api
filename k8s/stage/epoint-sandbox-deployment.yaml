apiVersion: apps/v1
kind: Deployment
metadata:
  name: epoint-sandbox
  labels:
    app: epoint-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: epoint-sandbox
  template:
    metadata:
      labels:
        app: epoint-sandbox
    spec:
      containers:
        - name: epoint-sandbox
          image: ghcr.io/martian56/epoint-sandbox:latest
          imagePullPolicy: Always
          env:
            - name: EPOINT_PUBLIC_BASE_URL
              value: https://www.novbetime.az/_epoint
          ports:
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: checkout-assets
              mountPath: /app/src/epoint_sandbox/web/static/tokens.css
              subPath: tokens.css
              readOnly: true
            - name: checkout-assets
              mountPath: /app/src/epoint_sandbox/web/static/checkout.css
              subPath: checkout.css
              readOnly: true
            - name: checkout-assets
              mountPath: /app/src/epoint_sandbox/web/static/logo.svg
              subPath: logo.svg
              readOnly: true
            - name: checkout-assets
              mountPath: /app/src/epoint_sandbox/web/static/novbetime-logo.png
              subPath: novbetime-logo.png
              readOnly: true
            - name: checkout-assets
              mountPath: /app/src/epoint_sandbox/web/templates/base.html
              subPath: base.html
              readOnly: true
            - name: checkout-assets
              mountPath: /app/src/epoint_sandbox/web/templates/checkout.html
              subPath: checkout.html
              readOnly: true
      volumes:
        - name: checkout-assets
          configMap:
            name: epoint-sandbox-checkout-assets
