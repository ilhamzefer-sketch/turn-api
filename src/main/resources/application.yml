spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ${APP_NAME:turn-api}
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${APP_JPA_DDL_AUTO:validate}
    show-sql: ${APP_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${APP_JPA_FORMAT_SQL:true}
  h2:
    console:
      enabled: false
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:6MB}
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  compression:
    enabled: true
  shutdown: graceful
  tomcat:
    max-http-form-post-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:6MB}
    max-swallow-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:6MB}

app:
  env: ${APP_ENV:local}
  upload:
    storage-root: ${APP_UPLOAD_STORAGE_ROOT:/tmp/novbetime-uploads}
    max-file-bytes: ${APP_UPLOAD_MAX_FILE_BYTES:5242880}
    max-dimension-pixels: ${APP_UPLOAD_MAX_DIMENSION_PIXELS:10000}
    max-image-pixels: ${APP_UPLOAD_MAX_IMAGE_PIXELS:25000000}
    antivirus:
      enabled: ${APP_UPLOAD_ANTIVIRUS_ENABLED:false}
      host: ${APP_UPLOAD_CLAMAV_HOST:127.0.0.1}
      port: ${APP_UPLOAD_CLAMAV_PORT:3310}
      connect-timeout: ${APP_UPLOAD_CLAMAV_CONNECT_TIMEOUT:2s}
      read-timeout: ${APP_UPLOAD_CLAMAV_READ_TIMEOUT:15s}
      chunk-bytes: ${APP_UPLOAD_CLAMAV_CHUNK_BYTES:8192}
  wallet:
    coins-per-azn: ${APP_WALLET_COINS_PER_AZN:10}
    minimum-top-up-coins: ${APP_WALLET_MINIMUM_TOP_UP_COINS:1}
    maximum-top-up-coins: ${APP_WALLET_MAXIMUM_TOP_UP_COINS:1000000}
    whatsapp-url: ${APP_WALLET_WHATSAPP_URL:https://wa.me/message/P63GI5XJ3PQLC1}
  legacy-api:
    enabled: ${APP_LEGACY_API_ENABLED:false}
  subscription:
    lifecycle-delay-ms: ${APP_SUBSCRIPTION_LIFECYCLE_DELAY_MS:300000}
    enforcement-enabled: ${APP_SUBSCRIPTION_ENFORCEMENT_ENABLED:true}
  privacy:
    guest-anonymization-cron: ${APP_GUEST_ANONYMIZATION_CRON:0 30 3 * * *}
  live-queue:
    provisioning-enabled: ${APP_LIVE_QUEUE_PROVISIONING_ENABLED:true}
    provisioning-delay-ms: ${APP_LIVE_QUEUE_PROVISIONING_DELAY_MS:30000}
    provisioning-initial-delay-ms: ${APP_LIVE_QUEUE_PROVISIONING_INITIAL_DELAY_MS:1000}
    reset-enabled: ${APP_LIVE_QUEUE_RESET_ENABLED:true}
    reset-delay-ms: ${APP_LIVE_QUEUE_RESET_DELAY_MS:30000}
    reset-initial-delay-ms: ${APP_LIVE_QUEUE_RESET_INITIAL_DELAY_MS:15000}
  sms:
    provider: ${APP_SMS_PROVIDER:disabled}
    endpoint: ${APP_SMS_ENDPOINT:}
    bearer-token: ${APP_SMS_BEARER_TOKEN:}
    sender-name: ${APP_SMS_SENDER_NAME:NovbeTime}
    connect-timeout-seconds: ${APP_SMS_CONNECT_TIMEOUT_SECONDS:5}
    request-timeout-seconds: ${APP_SMS_REQUEST_TIMEOUT_SECONDS:10}
  limits:
    pending-accounts:
      business-daily: ${APP_PENDING_ACCOUNTS_BUSINESS_DAILY:500}
      administrator-daily: ${APP_PENDING_ACCOUNTS_ADMINISTRATOR_DAILY:100}
      administrator-per-minute: ${APP_PENDING_ACCOUNTS_ADMINISTRATOR_PER_MINUTE:20}
  payment:
    mode: ${APP_PAYMENT_MODE:test}
    provider: ${APP_PAYMENT_PROVIDER:mock}
    callback-base-url: ${APP_PAYMENT_CALLBACK_BASE_URL:http://127.0.0.1:5275}
    birbank:
      base-url: ${BIRBANK_API_BASE_URL:https://txpgtst.kapitalbank.az/api}
      username: ${BIRBANK_USERNAME:}
      password: ${BIRBANK_PASSWORD:}
    abb:
      base-url: ${ABB_API_BASE_URL:https://api-test-c2b.abb-bank.az}
      username: ${ABB_USERNAME:}
      password: ${ABB_PASSWORD:}
      debit-account: ${ABB_DEBIT_ACCOUNT:}
      recipient-name: ${ABB_RECIPIENT_NAME:}
      recipient-account: ${ABB_RECIPIENT_ACCOUNT:}
      recipient-tax-id: ${ABB_RECIPIENT_TAX_ID:}
      recipient-bank-code: ${ABB_RECIPIENT_BANK_CODE:805250}
    reconciliation-enabled: ${APP_PAYMENT_RECONCILIATION_ENABLED:false}
    reconciliation-delay-ms: ${APP_PAYMENT_RECONCILIATION_DELAY_MS:60000}
    reconciliation-initial-delay-ms: ${APP_PAYMENT_RECONCILIATION_INITIAL_DELAY_MS:30000}
  security:
    jwt-secret: ${APP_JWT_SECRET:local-only-default-secret-change-before-production-1234567890}
    access-token-minutes: ${APP_ACCESS_TOKEN_MINUTES:10}
    privileged-access-token-minutes: ${APP_PRIVILEGED_ACCESS_TOKEN_MINUTES:5}
    jwt-issuer: ${APP_JWT_ISSUER:novbetime-api}
    jwt-audience: ${APP_JWT_AUDIENCE:novbetime-web}
    secure-cookies: ${APP_SECURE_COOKIES:false}
    allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5275,http://127.0.0.1:5275,http://localhost:5173,http://127.0.0.1:5173}
    trust-proxy-headers: ${APP_TRUST_PROXY_HEADERS:false}
    session:
      user-idle-minutes: ${APP_SESSION_USER_IDLE_MINUTES:30}
      privileged-idle-minutes: ${APP_SESSION_PRIVILEGED_IDLE_MINUTES:15}
      admin-idle-minutes: ${APP_SESSION_ADMIN_IDLE_MINUTES:10}
      user-absolute-hours: ${APP_SESSION_USER_ABSOLUTE_HOURS:12}
      privileged-absolute-hours: ${APP_SESSION_PRIVILEGED_ABSOLUTE_HOURS:8}
      admin-absolute-hours: ${APP_SESSION_ADMIN_ABSOLUTE_HOURS:4}
      retention-days: ${APP_SESSION_RETENTION_DAYS:90}
      cleanup-delay-ms: ${APP_SESSION_CLEANUP_DELAY_MS:86400000}
      cleanup-initial-delay-ms: ${APP_SESSION_CLEANUP_INITIAL_DELAY_MS:60000}
    rate-limit:
      enabled: ${APP_RATE_LIMIT_ENABLED:true}
      global-per-minute: ${APP_RATE_LIMIT_GLOBAL_PER_MINUTE:300}
      auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:10}
      payment-per-minute: ${APP_RATE_LIMIT_PAYMENT_PER_MINUTE:30}
      public-queue-per-minute: ${APP_RATE_LIMIT_PUBLIC_QUEUE_PER_MINUTE:60}
      store: ${APP_RATE_LIMIT_STORE:memory}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password-hash: ${ADMIN_PASSWORD_HASH:$2y$10$3Ehrpe5CUmnRa79/msUu3O2mQ.qwbdj.e/zefTCP8wfrqhxwHM/LG}
    bootstrap-username: admin
    bootstrap-password-hash: $2y$10$Z5z8aWo9dvgFB/frrm30g.9LtgQmtppe0fgsH90rUWziqzEVJuequ
    bootstrap-must-change: true

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  metrics:
    tags:
      application: ${APP_NAME:turn-api}
      environment: ${APP_ENV:local}
