spring:
  datasource:
    url: jdbc:postgresql://${DB_CONNECTION_IP}:${DB_CONNECTION_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}

app:
  env: stage
  payment:
    mode: test
  security:
    secure-cookies: true
    rate-limit:
      store: redis

server:
  forward-headers-strategy: framework
