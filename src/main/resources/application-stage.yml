spring:
  datasource:
    url: jdbc:postgresql://${DB_CONNECTION_IP}:${DB_CONNECTION_PORT:5432}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}

app:
  env: stage
  upload:
    antivirus:
      enabled: ${APP_UPLOAD_ANTIVIRUS_ENABLED:true}
  payment:
    mode: test
  security:
    secure-cookies: ${APP_SECURE_COOKIES:true}
    rate-limit:
      store: redis

server:
  forward-headers-strategy: framework
